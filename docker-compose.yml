version: "3"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: aptcommunitydb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/aptcommunitydb
      DB_USERNAME: root
      DB_PASSWORD: 1234
    depends_on:
      - db
volumes:
  db_data:
