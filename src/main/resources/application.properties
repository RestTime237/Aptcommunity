spring.application.name=AptCommunitySB

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MySQL? ?? ???? localhost ??
spring.datasource.url=jdbc:mysql://localhost:3306/aptcommunitydb?serverTimezone=Asia/Seoul&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${PORT:8080}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.web.resources.cache.cachecontrol.no-cache=true
spring.devtools.restart.enabled=false

server.servlet.context-path=/AptCommunity

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.springmvc=DEBUG
